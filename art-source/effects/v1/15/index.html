<!doctype html><html lang="ko"><meta charset="utf-8"><title>조운 적중 효과 최종본</title><style>body{background:#3b4857;color:white;font:16px sans-serif;padding:24px}canvas{width:288px;height:288px;image-rendering:pixelated}</style><h1>조운 적중 효과 · 승인본</h1><p>48×48 · 중앙40×40 · 10프레임 · 365ms · 아래는 반복 미리보기</p><canvas width="48" height="48"></canvas><script>fetch('manifest.json').then(r=>r.json()).then(async m=>{const f=m.effects[0].frames;const images=await Promise.all(f.map(x=>new Promise(ok=>{const im=new Image();im.onload=()=>ok(im);im.src='../../../../'+x.file})));let i=0;const c=document.querySelector('canvas').getContext('2d');function play(){c.clearRect(0,0,48,48);c.drawImage(images[i],0,0);let ms=f[i].durationMs;i=(i+1)%f.length;setTimeout(play,i===0?600:ms)}play()})</script></html>
