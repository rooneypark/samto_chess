<script>const entries=[{"id": "1", "name": "관우", "faction": "촉", "order": 1, "identity": "녹색 관모·도포, 긴 수염, 청룡언월도, 기존 갈색 말", "folder": "1", "identityDesign": "Guan Yu: majestic mature red-brown face, very long straight black beard, green folded headcloth, green robe over muted gold/steel armor, broad composed eyes. Mounted on existing chestnut horse, hold complete Green Dragon crescent glaive. Preserve iconic green silhouette, no helmet or giant gold horse mask.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "2", "name": "장비", "faction": "촉", "order": 2, "identity": "검붉은 갑옷, 넓은 검은 수염, 부릅뜬 눈매, 붉은 머리띠, 장팔사모, 보행", "folder": "2", "identityDesign": "Zhang Fei: broad powerful stocky infantry, round fierce tiger eyes, massive flared BLACK beard, red headband tied around black hair bun, thick exposed forearms, black/red lamellar armor, simple bronze shoulders. Hold long wavy serpentine spear. No fur collar, no silver helmet, no horse. Thick torso similar strength class as Xu Chu, not a giant.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "15", "name": "조운", "faction": "촉", "order": 3, "identity": "백마, 은창", "folder": "15", "identityDesign": "Zhao Yun: silver helmet with white plume, silver armor, blue scarf, white cape, spear, white horse; approved front", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "16", "name": "황충", "faction": "촉", "order": 4, "identity": "노장, 활", "folder": "16", "identityDesign": "Huang Zhong: aged veteran archer, long WHITE beard and white eyebrows, compact bronze/gold military helmet with modest red tassel, weathered face, green shoulder cloak over bronze lamellar armor. Bow in hand, arrow quiver over shoulder. Older stocky normal warrior, full boots. Distinct from bare-chested Huang Gai.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "35", "name": "제갈량", "faction": "촉", "order": 5, "identity": "높은 남색 관모, 흰색·연녹색 도포 brown/gray leather and plain iron lamellar vest, subdued plum sash. Hold a straight spear and SIMPLE WOODEN shield with metal rim, not gilded royal lion shield. Visually less ornate than named generals.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "archer", "name": "의용궁병", "faction": "군웅", "order": 13, "identity": "삿갓, 활", "folder": "archer", "identityDesign": "Volunteer archer: ordinary adult foot soldier, broad woven STRAW HAT, plain tan/brown cloth tunic with modest iron chest vest, muted red sash. Simple wooden bow and arrow quiver. Slim average rank-and-file body, few ornaments, no gold noble shoulders or giant beard.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "tactician", "name": "군영참모", "faction": "군웅", "order": 14, "identity": "죽간", "folder": "tactician", "identityDesign": "Camp adviser: ordinary middle-aged scholar, SMALL plain charcoal square cloth cap, pale gray-lilac robe with brown narrow belt, modest short moustache. Hold bundled bamboo slips visibly with both hands. Slender ordinary body, no tall ornate court crown or feathers; subordinate support unit.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "simayi", "name": "사마의", "faction": "위", "order": 15, "identity": "검은 도포, 깃털부채", "folder": "simayi", "identityDesign": "Sima Yi: severe elderly-thin strategist, long narrow face, hooded sharp eyes, slim moustache and long narrow gray-black beard. Tall angular BLACK official crown, high pale inner collar and enveloping black/navy robe with restrained purple trim. Hold compact dark-gray feather fan low. Outline must differ from Zhuge Liang's white loose robe and rounded blue cap.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "dianwei", "name": "전위", "faction": "위", "order": 16, "identity": "쌍철극", "folder": "dianwei", "identityDesign": "Dian Wei: extremely muscular stocky bodyguard but same tallness class as Xu Chu ixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "luxun", "name": "육손", "faction": "오", "order": 31, "identity": "서생, 횃불", "folder": "luxun", "identityDesign": "Lu Xun: youthful but clearly ADULT scholarly commander, smooth clean-shaven oval face, focused fine brows, small close-fitting blue steel cap/helmet, green neck scarf. Slim silver-gray light chest armor over ivory robe with crimson waist sash, red cape edge. Hold small torch as established game equipment. Slim adult shoulders, not a child or plain white-robed magician.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "sunquan", "name": "손권", "faction": "오", "order": 32, "identity": "붉은 관복, 검", "folder": "sunquan", "identityDesign": "Sun Quan: mature dignified ruler, broad face, long FULL REDDISH-BROWN beard, thick eyebrows. Low gold crown on brown-black tied hair, rich burgundy court robe over understated armor, purple-patterned central panel simplified to large blocks, wide draped sleeves. Hold straight sword by hilt. Distinct from Cao Cao's short forked dark beard and navy armor; average lord body.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "ganning", "name": "감녕", "faction": "오", "order": 33, "identity": "방울, 사슬낫", "folder": "ganning", "identityDesign": "Gan Ning: roguish athletic pirate warrior, tanned face, unruly swept black hair with red headband, confident grin and stubble. Asymmetric open red/black vest and leather straps with exposed muscular shoulder, conspicuous few GOLD BELLS at belt. Hold curved chain sickle with a clear slack chain. Bold red scarf, no symmetric default gold armor and no large fur collar.", "artRevision": "pixel256-v1", "canvas": [256, 256], "foot": [128, 224]}, {"id": "taishici", "name": "태사자", "faction": "오", "order": 34, "identity": "활과 쌍극", "folder": "taishici", "identityDesign": "Taishi Ci: disciplined powerful archer warrior, square tan face, short neatly trimmed beard. Bronze/steel helm
