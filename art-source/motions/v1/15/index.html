<!doctype html><html lang="ko"><meta charset="utf-8"><title>조운 확정 모션</title><style>body{background:#303846;color:white;font-family:sans-serif}main{display:flex;flex-wrap:wrap}canvas{width:256px;height:256px;image-rendering:pixelated}section{margin:12px}</style><h1>조운 확정 모션 · 2026-11-15</h1><p>정면 숨쉬기와 이동 3방향 · 게임 연결 대기</p><main></main><script>fetch('manifest.json').then(r=>r.json()).then(async m=>{for(const c of m.clips){const s=document.createElement('section');s.innerHTML='<h2>'+c.clipId+'</h2><canvas width="256" height="256"></canvas>';document.querySelector('main').append(s);const ctx=s.querySelector('canvas').getContext('2d');const ims=await Promise.all(c.frames.map(f=>new Promise(ok=>{const im=new Image();im.onload=()=>ok(im);im.src=f.file.replace('art-source/motions/v1/15/','')})));let i=0;function draw(){ctx.clearRect(0,0,256,256);ctx.drawImage(ims[i],0,0);const ms=c.frames[i].durationMs;i=(i+1)%ims.length;setTimeout(draw,ms)}draw()}})</script></html>
