<!doctype html><html lang="ko"><meta charset="utf-8"><title>조운 최종 승인 자산</title><style>body{background:#26343d;color:#eee;font:16px sans-serif;padding:20px}main{display:flex;flex-wrap:wrap;gap:16px}canvas{width:256px;height:256px;image-rendering:pixelated;background:#3b4857}h2{font-size:17px}a{color:#9fe1df}button{padding:10px}</style><h1>조운 최종 승인본 · 2026-11-16</h1><p>대기1 · 이동3 · 공격3 · 스킬3 · 적중효과1 | 게임 연결 별도</p><p><a href="../../../effects/v1/15/index.html">적중 효과 보기</a></p><button onclick="paused=!paused;this.textContent=paused?'재생':'일시정지'">일시정지</button><main></main><script>let paused=false;fetch('manifest.json').then(r=>r.json()).then(async m=>{for(const c of m.clips){const s=document.createElement('section');s.innerHTML='<h2>'+c.clipId+'</h2><canvas width="256" height="256"></canvas>';document.querySelector('main').append(s);const ctx=s.querySelector('canvas').getContext('2d');const ims=await Promise.all(c.frames.map(f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src='../../../../'+f.file})));let i=0;function draw(){if(paused){setTimeout(draw,50);return}ctx.clearRect(0,0,256,256);ctx.drawImage(ims[i],0,0);const ms=c.frames[i].durationMs;i=(i+1)%ims.length;setTimeout(draw,ms)}draw()}})</script></html>
