<!doctype html><html lang="ko"><meta charset="utf-8"><title>장비 후면 프레임 검수</title><style>
*{box-sizing:border-box}body{margin:0;background:#161c27;color:#eef3fc;font:16px system-ui;padding:22px}h1{font-size:23px;margin:0 0 10px}button,select,input{font:inherit}button,select{background:#303d52;color:white;border:1px solid #60718b;border-radius:6px;padding:9px 14px;cursor:pointer}button:focus-visible{outline:3px solid #58d8ff}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.views{display:flex;gap:20px;flex-wrap:wrap}.panel{flex:1;min-width:280px}.panel{background:#232d3d;padding:14px;border-radius:10px}canvas{display:block;image-rendering:pixelated;max-width:100%;height:auto;background:#28303e}p{color:#becbdf}#frames{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}#frames button{min-width:45px}#frames button.active{background:#09627a;border-color:#6fe4ff}#frames button.marked{box-shadow:inset 0 -5px #ffbd59}#position{font-weight:bold;font-size:23px;min-width:170px}#status{color:#ffd48a}textarea{width:100%;background:#243045;color:white;padding:10px;border:1px solid #60718b}label{display:flex;gap:8px;align-items:center}.muted{font-size:14px;color:#aebdd3}</style>
<h1>장비 최종 모션 · 한 프레임씩 검수</h1><div class="bar"><select id="clip"><option value="move-rear-foot-axis-v3-trim15">이동 · 원본 15번 제외 (14장)</option><option value="move-rear-foot-axis-v3">이동 · 발 방향 보정 원본</option><option value="a1-rear-shaft-visible-v4">공격 1 · 봉 가시성 재요청 v4 (검토)</option><option value="a1-rear-contact-v3">공격 1 · 관통 보정 결과</option><option value="a2-rear-contact-v3">공격 2 · 관통 보정 결과</option></select><span id="status"></span></div>
<div class="bar"><button id="prev">◀ 이전</button><button id="play">▶ 재생</button><button id="next">다음 ▶</button><span id="position"></span><button id="mark">이 프레임 문제 표시</button><select id="speed"><option value="1">원래 속도</option><option value="2">½ 속도</option><option value="4">¼ 속도</option></select></div>
<input id="slider" aria-label="프레임 선택" type="range" min="1" max="15" value="1" style="width:100%"><p class="muted">← → : 한 장 이동 · Space : 재생/정지 · 번호 클릭 가능. 이미지 수정·생성 요청 기능은 없습니다.</p>
<div class="views"><section class="panel"><h3>전신 · 2배</h3><canvas id="full" width="512" height="512"></canvas></section><section class="panel"><h3>신발 확대 · 6배</h3><canvas id="feet" width="432" height="288"></canvas><p>같은 프레임의 원본 픽셀 확대입니다.</p><label>배경 <select id="bg"><option value="#28303e">어두운 배경</option><option value="#cbd2dc">밝은 배경</option><option value="#496e57">녹색 배경</option></select></label><p id="marked"></p><textarea id="notes" rows="4" placeholder="관찰 메모 (이 검수 화면에만 저장)"></textarea></section></div><div id="frames"></div>
<script src="zhangfei-clips.js"></script><script>
const $=id=>document.getElementById(id);let imgs=[],index=0,timer=null,playing=false,count=1,durations=[46],marks=new Set();
const names={idle:'대기',a1:'공격 1',a2:'공격 2',a3:'공격 3',move:'이동',s1:'스킬'},views={front:'정면',left:'측면',rear:'후면'};
$('clip').replaceChildren();for(const [c,vs] of Object.entries(window.ZHANGFEI_CLIPS))for(const v of Object.keys(vs)){const o=document.createElement('option');o.value=c+'/'+v;o.textContent=names[c]+' · '+views[v]+' · 최종';$('clip').append(o)}$('clip').value='move/rear';
function storageKey(){return 'zhangfei-final-review-'+$('clip').value}function save(){localStorage.setItem(storageKey(),JSON.stringify({marks:[...marks],notes:$('notes').value}))}
function stop(){playing=false;clearTimeout(timer);$('play').textContent='▶ 재생'}
function draw(){for(const id of ['full','feet']){const c=$(id),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle=$('bg').value;ctx.fillRect(0,0,c.width,c.height);const im=imgs[index];if(im?.naturalWidth){if(id==='full')ctx.drawImage(im,0,0,512,512);else ctx.drawImage(im,96,188,72,48,0,0,432,288)}}$('position').textContent=`${String(index+1).padStart(2,'0')} / ${count} · ${durations[index]}ms`;$('slider').value=index+1;$('marked').textContent='표시한 프레임: '+([...marks].sort((a,b)=>a-b).join(', ')||'없음');[...$('frames').children].forEach((b,i)=>b.className=(i===index?'active ':'')+(marks.has(i+1)?'marked':''))}
function step(n){stop();index=(index+n+count)%count;draw()}function tick(){if(!playing)return;timer=setTimeout(()=>{index=(index+1)%count;draw();tick()},durations[index]*Number($('speed').value))}
let loadId=0;async function load(){const current=++loadId;stop();index=0;imgs=[];const [c,v]=$('clip').value.split('/'),a=ZHANGFEI_CLIPS[c][v];count=a.files.length;durations=a.durations;$('slider').max=count;const saved=JSON.parse(localStorage.getItem(storageKey())||'{}');marks=new Set(saved.marks||[]);$('notes').value=saved.notes||'';$('frames').replaceChildren();for(let i=0;i<count;i++){const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.onclick=()=>{stop();index=i;draw()};$('frames').append(b)}$('status').textContent='불러오는 중';try{const loaded=await Promise.all(a.files.map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})));if(current!==loadId)return;imgs=loaded;$('status').textContent='최종 확정 '+count+'장 · 원본 타이밍';}catch(e){if(current!==loadId)return;$('status').textContent='자산 복원이 필요합니다: python tools/asset_packs.py restore'}draw()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>{if(playing)stop();else{playing=true;$('play').textContent='❚❚ 정지';tick()}};$('slider').oninput=()=>{stop();index=Number($('slider').value)-1;draw()};$('clip').onchange=load;$('bg').onchange=draw;$('mark').onclick=()=>{marks.has(index+1)?marks.delete(index+1):marks.add(index+1);save();draw()};$('notes').oninput=save;document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}if(e.code==='Space'){e.preventDefault();$('play').click()}});load();
</script></html>
