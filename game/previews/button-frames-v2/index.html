<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공용 버튼 · 제목 이미지</title><link rel="stylesheet" href="../../art-controls.css"><link rel="stylesheet" href="../../ui-shell.css"><style>body{margin:0;background:#101f31;color:#fff0ce;font-family:Georgia,'Batang',serif}.game{width:min(941px,100%);margin:auto;container-type:inline-size;box-sizing:border-box;padding:24px}h1{font-size:24px}h2{font-size:18px;margin:28px 0 12px}.title{width:275px;height:106px;max-width:100%;display:grid;place-items:center;image-rendering:pixelated}.row{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}button{position:relative;border:0;background:transparent;color:#fff0ce;font:700 18px Georgia,'Batang',serif;padding:0 16px;height:64px;image-rendering:pixelated;cursor:pointer}.wide{width:100%}.medium{width:calc(50% - 7px)}.small{width:calc(33.333% - 10px)}p{line-height:1.6;font-size:14px}button:disabled{cursor:default}</style><main class="game"><h1>공용 버튼 · 제목 이미지</h1><div class="title"><img width="220" src="../../assets/ui-common/gate-title-samto.png" alt="삼토체스"></div><h2>일반 버튼</h2><div class="row"><button class="wide" data-tone="blue">성문으로</button></div><div class="row"><button class="medium" data-tone="blue">편성 변경</button><button class="medium" data-tone="blue">전투 기록</button></div><div class="row"><button class="small" data-tone="blue">상세</button><button class="small" data-tone="blue">취소</button><button class="small" data-tone="blue" disabled>잠김</button></div><h2>강조 · 선택 버튼</h2><div class="row"><button class="wide" data-tone="green">보상 받기</button></div><div class="row"><button class="medium" data-tone="green">선택 완료</button><button class="medium" data-tone="green">성장</button></div><h2>출정 준비도 새 스타일 적용</h2><div class="row"><button class="wide" id="campaign-depart" data-tone="green">출정 준비</button></div><p>같은 원본·같은 모서리. 버튼 크기에 맞춰 중앙과 직선 테두리만 늘어납니다.</p></main><script type="module">import{nineSlice}from'../../nine-slice.js';import{initArtPress}from'../../art-controls.js';initArtPress(document.querySelector('.game'));await Promise.all([...document.querySelectorAll('[data-tone]')].map(el=>nineSlice(el,el.dataset.tone)));window.ready=true;</script></html>
